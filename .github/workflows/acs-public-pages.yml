name: Publish AI Consensus public pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'oauth/**'
      - '.github/workflows/acs-public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download only approved public HTML files (no Git checkout)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _public/oauth
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          for file in index.html about.html oauth/index.html oauth/privacy.html; do
            curl --fail --location --silent --show-error --retry 3 \
              "${base}/${file}" -o "_public/${file}"
            test -s "_public/${file}"
          done
          touch _public/.nojekyll
          test "$(find _public -type f | wc -l)" -eq 5
      - name: Upload public pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated static pages
        id: deployment
        uses: actions/deploy-pages@v4
