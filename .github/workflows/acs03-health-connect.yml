name: ACS-03 Health Connect Synthetic Tests
on:
  pull_request:
    paths:
      - 'tools/health_connect_*.py'
      - 'tests/test_health_connect_*.py'
      - '.github/workflows/acs03-health-connect.yml'
  workflow_dispatch:
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code parses
        run: python -m compileall -q tools/health_connect_cloud_preflight.py tools/health_connect_drive_fetch.py tools/health_connect_steps_candidate.py tools/health_connect_cloud_probe.py tools/health_connect_range_probe.py tools/health_connect_memory_import.py
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -p 'test_health_connect_*.py' -v
