name: Phase 1 acceptance regression
on:
  push:
    branches:
      - phase1-closure-reconcile-20261031
      - phase1-integration-review-20261113
  pull_request:
    paths:
      - agents/phase1_acceptance_review.py
      - agents/test_phase1_acceptance_review.py
      - .github/workflows/phase1-acceptance-regression.yml
      - agents/verify_phase1_recovery_ci.py
      - agents/phase1_production_recovery_probe.py
      - agents/install_phase1_recovery.sh
jobs:
  acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test exact commit
        run: |
          python -m py_compile agents/phase1_acceptance_review.py agents/test_phase1_acceptance_review.py
          cd agents
          python -m unittest -v test_phase1_acceptance_review.py
      - name: Isolated watchdog failure and recovery proof
        run: python agents/verify_phase1_recovery_ci.py
      - name: Validate production-host probe safely (no live execution)
        run: |
          python -m py_compile agents/phase1_production_recovery_probe.py
          python agents/phase1_production_recovery_probe.py --self-test
      - name: Validate read-only production preflight fixtures
        run: |
          python -m py_compile agents/phase1_deployment_preflight.py
          python - <<'PY'
          import sys
          from datetime import datetime, timezone, timedelta
          sys.path.insert(0, "agents")
          from phase1_deployment_preflight import check_report
          report = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "agents": {f"ACS-{n:02d}": {"verified": True, "status": "current", "health_status": "healthy"} for n in range(1,6)},
              "pythonanywhere_schedule": {
                  "available": True, "acs01_task": {"enabled": True},
                  "health_task": {"mode": "acs01_integrated", "integrated_wiring_verified": True,
                                  "standalone_found": False, "matching_task_ids": [1524414]}
              }
          }
          assert check_report(report) == []
          report["pythonanywhere_schedule"]["acs01_task"]["enabled"] = False
          assert "parent_schedule_not_confirmed" in check_report(report)
          report["pythonanywhere_schedule"]["acs01_task"]["enabled"] = True
          report["pythonanywhere_schedule"]["health_task"]["matching_task_ids"] = [1521711]
          assert "unexpected_parent_task_id" in check_report(report)
          print("PASS: read-only preflight recognizes current layout and rejects schedule mismatch")
          report["pythonanywhere_schedule"]["health_task"]["matching_task_ids"] = [1524414]
          for age, passing in ((29, True), (31, False), (35, False)):
              report["generated_at_utc"] = (datetime.now(timezone.utc) - timedelta(hours=age)).isoformat()
              assert (check_report(report) == []) is passing, f"incorrect preflight report TTL: {age}h"
          report["generated_at_utc"] = "2026-11-13T10:00:00"
          assert "report_bad_timestamp" in check_report(report)
          print("PASS: production preflight enforces 30h TTL and rejects naive timestamp")
          PY
      - name: Verify independent scheduler recovery remains fail closed
        run: |
          python -m py_compile agents/phase1_independent_schedule_guard.py agents/test_phase1_independent_schedule_guard.py
          cd agents
          python -m unittest -v test_phase1_independent_schedule_guard.py
      - name: Simulate controlled scheduler test with no live changes
        run: |
          python -m py_compile agents/phase1_controlled_scheduler_test.py agents/test_phase1_controlled_scheduler_test.py
          cd agents
          python -m unittest -v test_phase1_controlled_scheduler_test.py
      - name: Verify redacted scheduler backup comparison
        run: |
          python -m py_compile agents/phase1_scheduler_diff_readonly.py agents/test_phase1_scheduler_diff_readonly.py
          cd agents
          python -m unittest -v test_phase1_scheduler_diff_readonly.py
      - name: Inspect read-only host inventory safely in offline fixtures
        run: |
          python -m py_compile agents/phase1_host_evidence_inventory.py agents/test_phase1_host_evidence_inventory.py
          cd agents
          python -m unittest -v test_phase1_host_evidence_inventory.py
      - name: Independently exercise disposable process and scheduler recovery
        run: |
          python -m py_compile agents/test_phase1_process_scheduler_isolated.py
          cd agents
          python -m unittest -v test_phase1_process_scheduler_isolated.py
      - name: Retain simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-recovery-isolated-simulation
          path: phase1_recovery_simulation_evidence.json
          retention-days: 30
      - name: Retain independently observed disposable recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-disposable-process-scheduler-recovery
          path: phase1_disposable_recovery_evidence.json
          if-no-files-found: error
          retention-days: 30
