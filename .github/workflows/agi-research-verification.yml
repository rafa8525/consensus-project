name: AGI isolated research verification
on:
  push:
    branches:
      - research/agi-iteration-001-20261119
    paths:
      - 'research/agi_iteration001/**'
      - '.github/workflows/agi-research-verification.yml'
  pull_request:
    paths:
      - 'research/agi_iteration001/**'
      - '.github/workflows/agi-research-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public research branch without submodule traversal
        shell: bash
        run: |
          git -c submodule.recurse=false clone --depth 1 --single-branch --branch research/agi-iteration-001-20261119 https://github.com/rafa8525/consensus-project.git "$RUNNER_TEMP/agi-checkout"
          cp -a "$RUNNER_TEMP/agi-checkout/research" "$GITHUB_WORKSPACE/research"
          git -C "$RUNNER_TEMP/agi-checkout" rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Python tests (no credentials or production services)
        working-directory: research/agi_iteration001
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v test_train.py test_runtime.py test_worker_runtime.py test_local_inference.py test_model_worker_integration.py test_leased_worker.py test_leased_model_worker.py test_acs_public_triage.py test_acs_private_triage.py test_model_improvement_experiment.py test_replicated_model_evaluation.py
          python model_improvement_experiment.py
          python replicated_model_evaluation.py
          python validate_registry.py
