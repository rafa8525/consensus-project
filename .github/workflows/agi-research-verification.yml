name: AGI isolated research verification
on:
  push:
    branches:
      - research/agi-iteration-001-20261119
    paths:
      - 'research/agi_iteration001/**'
      - 'research/agi_prototype008/**'
      - '.github/workflows/agi-research-verification.yml'
  pull_request:
    paths:
      - 'research/agi_iteration001/**'
      - 'research/agi_prototype008/**'
      - '.github/workflows/agi-research-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out research head without broken submodule traversal
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git -c submodule.recurse=false clone --depth 1 --single-branch --branch research/agi-iteration-001-20261119 https://github.com/rafa8525/consensus-project.git "$RUNNER_TEMP/agi-checkout"
          test "$(git -C "$RUNNER_TEMP/agi-checkout" rev-parse HEAD)" = "$EXPECTED_SHA"
          cp -a "$RUNNER_TEMP/agi-checkout/research" "$GITHUB_WORKSPACE/research"
          echo "Verified research commit: $EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated Python tests (no credentials or production services)
        working-directory: research/agi_iteration001
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v test_train.py test_runtime.py test_worker_runtime.py test_local_inference.py test_model_worker_integration.py test_leased_worker.py test_leased_model_worker.py test_acs_public_triage.py test_acs_private_triage.py test_model_improvement_experiment.py test_replicated_model_evaluation.py test_external_benchmark_gate.py test_clinc_ood_protocol.py test_ood_threshold_calibration.py test_milestone14_holdout_gate.py test_three_role_research_cycle.py test_three_role_provider_v2.py test_openai_proposal_adapter.py test_api_call_admission.py test_solo_vs_team_planning.py test_milestone20_planner.py test_milestone21_robustness.py test_milestone22_confirmation.py test_milestone23_symbolic_benchmark.py test_milestone24_ood_stress.py test_live_trial_readiness.py test_funding_guard.py test_one_shot_proposal_trial.py test_live_workflow_candidate.py test_safe_trial_diagnostics.py test_response_envelope_diagnostics.py test_trial2_proposal_trial.py test_trial2_workflow_candidate.py test_trial2_repaired_workflow_review.py test_trial2_reasoning_contract.py test_proposal_evidence.py test_trial2_compatibility_workflow.py test_trial2_sanitized_receipt.py test_trial2_contract_repair.py test_trial2_contract_receipt_integration.py test_trial2_schema_workflow_review.py test_bounded_proposal_evaluation.py test_annotation_quality_preflight.py
          python bounded_proposal_evaluation.py
          python model_improvement_experiment.py
          python replicated_model_evaluation.py
          python external_benchmark_gate.py
          python validate_registry.py
          TASK_DIR="$(mktemp -d)"
          trap 'rm -rf "$TASK_DIR"' EXIT
          python three_role_research_cycle.py --db "$TASK_DIR/experiment.db" run
          python three_role_research_cycle.py --db "$TASK_DIR/experiment.db" status
          python three_role_provider_v2.py --db "$TASK_DIR/provider_v2.db"
          python solo_vs_team_planning.py --output "$TASK_DIR/planning_results.json"
          python milestone20_planner.py --output "$TASK_DIR/milestone20_results.json"
          python milestone21_robustness.py --output "$TASK_DIR/milestone21_results.json"
          python milestone22_confirmation.py --output "$TASK_DIR/milestone22_results.json"
          python milestone23_symbolic_benchmark.py --output "$TASK_DIR/milestone23_results.json"
          python milestone24_ood_stress.py --output "$TASK_DIR/milestone24_results.json"
          python live_trial_readiness.py
          python funding_guard.py
          python one_shot_proposal_trial.py --dry-run
          python trial2_proposal_trial.py --dry-run
      - name: Verify Prototype 008 offline (no credentials or API requests)
        working-directory: research/agi_prototype008
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          python -m unittest discover -v
      - name: Run pinned external CLINC150 OOD evaluation (no uploaded dataset)
        working-directory: research/agi_iteration001
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          TEMP_DATA="$(mktemp)"
          trap 'rm -f "$TEMP_DATA"' EXIT
          EXPECTED_SHA="36923c3705a59e08fe9c3883d8bc2dd966ef93e22cb78ac41171782a698d56e0"
          curl --fail --location --silent --show-error --retry 2 --max-time 25 --output "$TEMP_DATA" "https://raw.githubusercontent.com/clinc/oos-eval/828f8093932c8fe6ca7936c3d2e52903b1c523de/data/data_full.json"
          echo "$EXPECTED_SHA  $TEMP_DATA" | sha256sum --check --status
          echo "CLINC150 source SHA256 verified: $EXPECTED_SHA"
          python ood_threshold_calibration.py --clinc-json "$TEMP_DATA" --sha256 "$EXPECTED_SHA"
