name: ACS Safe Sync Regression Tests

on:
  push:
    branches: [v1.1-dev]
    paths:
      - "agents/safe_sync_live_branch.py"
      - "tests/test_safe_sync_live_branch.py"
      - ".github/workflows/acs-safe-sync-tests.yml"
  pull_request:
    branches: [v1.1-dev]
    paths:
      - "agents/safe_sync_live_branch.py"
      - "tests/test_safe_sync_live_branch.py"
      - ".github/workflows/acs-safe-sync-tests.yml"

permissions:
  contents: read

jobs:
  safe-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run safe-sync regression tests
        run: python -m unittest -v tests.test_safe_sync_live_branch
