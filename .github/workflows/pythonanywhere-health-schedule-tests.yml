name: PythonAnywhere health publisher schedule regression
on:
  push:
    paths:
      - 'agents/pythonanywhere_health_bridge.py'
      - 'tests/test_pythonanywhere_health_schedule.py'
      - '.github/workflows/pythonanywhere-health-schedule-tests.yml'
  pull_request:
    paths:
      - 'agents/pythonanywhere_health_bridge.py'
      - 'tests/test_pythonanywhere_health_schedule.py'
      - '.github/workflows/pythonanywhere-health-schedule-tests.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m py_compile agents/pythonanywhere_health_bridge.py tests/test_pythonanywhere_health_schedule.py
      - run: python -m unittest discover -s tests -p 'test_pythonanywhere_health_schedule.py' -v
