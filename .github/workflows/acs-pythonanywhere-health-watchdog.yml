name: PythonAnywhere Health Snapshot Watchdog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acs-pythonanywhere-health-watchdog.yml"
      - "tools/health_snapshot_watchdog.py"
      - "tests/test_health_snapshot_watchdog.py"
      - "agents/pythonanywhere_health_bridge.py"
      - "tests/test_public_health_snapshot.py"

permissions:
  contents: read

jobs:
  check-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published health evidence
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate watchdog logic
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "."
        run: python -m unittest -v tests.test_health_snapshot_watchdog tests.test_public_health_snapshot
      - name: Check published PythonAnywhere agent health
        run: python tools/health_snapshot_watchdog.py
