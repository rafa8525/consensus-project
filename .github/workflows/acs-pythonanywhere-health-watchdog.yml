name: PythonAnywhere Health Snapshot Watchdog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acs-pythonanywhere-health-watchdog.yml"

permissions:
  contents: read

jobs:
  check-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published health evidence
        uses: actions/checkout@v4
      - name: Verify heartbeat freshness without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("logs/system/pythonanywhere_health.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError("not a JSON object")
              if payload.get("source") != "pythonanywhere":
                  raise ValueError("unexpected health evidence source")
              value = payload.get("generated_at_utc")
              if not isinstance(value, str):
                  raise ValueError("missing generated_at_utc")
              stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if stamp.tzinfo is None:
                  raise ValueError("timestamp is missing UTC offset")
              age_hours = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 3600
              print(f"PythonAnywhere health snapshot age: {age_hours:.2f} hours")
              if not (-0.083 <= age_hours <= 36):
                  raise ValueError(f"health snapshot age outside permitted 0–36h range: {age_hours:.2f}h")
              print("PASS: health snapshot is recent and valid")
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
              print(f"::error title=PythonAnywhere snapshot stale or invalid::{type(exc).__name__}: {exc}")
              sys.exit(1)
          PY
