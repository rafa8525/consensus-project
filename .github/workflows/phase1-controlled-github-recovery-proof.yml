name: Phase 1 Controlled GitHub Recovery Proof

# Manual only. Never execute production interruption on push or cron.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Temporarily disable REAL ACS-01 task 1524414 and restore it (requires confirmation)"
        type: boolean
        default: false
        required: true
      confirmation:
        description: "For LIVE test only, enter TEST-ACS01-1524414 exactly"
        type: string
        default: ""
        required: false

permissions:
  contents: read

# Coordinate with the six-hour independent guard.
concurrency:
  group: acs01-independent-scheduler-guard
  cancel-in-progress: false

jobs:
  controlled-recovery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify approved recovery code and mock-only failure cases
        run: |
          python -m py_compile agents/phase1_independent_schedule_guard.py agents/phase1_github_controlled_probe.py
          cd agents
          python -m unittest -q test_phase1_independent_schedule_guard.py
          python -m unittest -v test_phase1_independent_recovery_e2e.py
          python -m unittest -v test_phase1_github_controlled_probe.py
      - name: Mandatory isolated simulation — no live changes
        working-directory: agents
        run: python phase1_github_controlled_probe.py
      - name: Controlled live intervention — only on explicit manual request
        if: inputs.execute == true
        working-directory: agents
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          ACS_SCHEDULER_RECOVERY_ENABLED: ${{ vars.ACS_SCHEDULER_RECOVERY_ENABLED }}
          ACS_SCHEDULER_MAINTENANCE: ${{ vars.ACS_SCHEDULER_MAINTENANCE }}
          ACS_LIVE_TEST_CONFIRM: ${{ inputs.confirmation }}
        run: python phase1_github_controlled_probe.py --execute
      - name: Retain redacted simulation or recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-github-controlled-recovery-proof
          path: agents/phase1_github_controlled_probe_evidence.json
          if-no-files-found: warn
          retention-days: 30
