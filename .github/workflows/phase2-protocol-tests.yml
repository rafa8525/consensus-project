name: Phase 2 isolated protocol tests
on:
  push:
    branches: [phase2-agent-coordination]
    paths:
      - 'agents/phase2_protocol.py'
      - 'agents/phase2_adapter.py'
      - 'agents/phase2_router.py'
      - 'agents/planner.py'
      - 'agents/executor.py'
      - 'tests/test_phase2_protocol.py'
      - 'tests/test_phase2_adapter.py'
      - 'tests/test_phase2_router.py'
      - '.github/workflows/phase2-protocol-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated protocol tests (stdlib only)
        run: python -m unittest discover -s tests -p 'test_phase2_*.py' -v
