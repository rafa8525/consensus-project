name: ACS Targeted Regression Tests

on:
  push:
    branches: [v1.1-dev]
    paths:
      - "agents/supervisor.py"
      - "agents/run_acs01_supervisor.sh"
      - "agents/run_acs_cycle.py"
      - "agents/continuity_guardian_agent.py"
      - "agents/infrastructure_guardian.py"
      - "tools/fitness_tracking_verifier.py"
      - "tools/health_master.py"
      - "tools/production_readiness.py"
      - "tools/gmail_auth_setup.py"
      - "tools/absorb_memory.py"
      - "tools/write_absorption_public_marker.py"
      - "tests/test_*.py"
      - ".github/workflows/acs-targeted-regression-tests.yml"
  pull_request:
    branches: [v1.1-dev]

permissions:
  contents: read

jobs:
  targeted-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run targeted regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "."
        run: |
          python -m unittest -v \
            tests.test_fitness_tracking_verifier \
            tests.test_guardian_log_rotation \
            tests.test_infrastructure_notifications \
            tests.test_supervisor_exit_status \
            tests.test_acs_cycle_status_contract \
            tests.test_absorption_marker \
            tests.test_absorb_memory_empty \
            tests.test_health_master_pipeline \
            tests.test_continuity_sms_delivery \
            tests.test_production_readiness \
            tests.test_acs01_launcher_exit \
            tests.test_gmail_token_persistence \
            tests.test_gmail_auth_recovery
