name: ACS-03 Diagnostics Regression
on:
  push:
    branches:
      - repair/acs03-diagnostics-v2-20261019
  pull_request:
    paths:
      - agents/pythonanywhere_health_bridge.py
      - tests/test_acs03_bridge_diagnostics.py
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile diagnostics and tests
        run: python -m py_compile agents/pythonanywhere_health_bridge.py tests/test_acs03_bridge_diagnostics.py
      - name: Run isolated diagnostics regressions
        run: python -m unittest discover -s tests -p 'test_acs03_bridge_diagnostics.py' -v
