name: ACS candidate backup tests
on:
  pull_request:
    branches: [v1.1-dev]
    paths:
      - 'tools/verified_backup_candidate.py'
      - 'agents/supervisor.py'
      - 'agents/backup_health.py'
      - 'tests/test_acs_backup_health.py'
      - 'tools/acs_encrypted_backup_runner.py'
      - 'tools/run_acs_backup_cycle.py'
      - 'tests/test_acs_backup_cycle.py'
      - 'tools/secure_backup_transport_candidate.py'
      - 'tests/test_verified_backup_candidate.py'
      - 'tests/test_secure_backup_transport_candidate.py'
      - 'tests/test_backup_end_to_end_candidate.py'
      - 'tests/test_backup_key_recovery_candidate.py'
      - 'tools/acs_synthetic_drive_probe.py'
      - '.github/workflows/acs-backup-candidate-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install cryptography google-api-python-client
      - name: Compile synthetic Drive probe
        run: python -m py_compile tools/acs_synthetic_drive_probe.py
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_*backup*candidate.py' -v
      - name: Run ACS backup health tests
        run: python -m unittest discover -s tests -p 'test_acs_backup_health.py' -v
      - name: Run backup cycle fail-closed tests
        run: python -m unittest discover -s tests -p 'test_acs_backup_cycle.py' -v
