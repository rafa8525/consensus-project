name: Report Master Fail-Closed Tests
on:
  pull_request:
    branches: [v1.1-dev]
    paths:
      - "tools/report_master.py"
      - "tests/test_report_master_fail_closed.py"
      - ".github/workflows/report-master-fail-closed-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        env:
          PYTHONPATH: "."
        run: python -m unittest -v tests.test_report_master_fail_closed
